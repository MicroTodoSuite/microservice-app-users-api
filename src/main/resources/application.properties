jwt.secret=${JWT_SECRET:myfancysecret}
server.port=${SERVER_PORT:8083}
spring.application.name=${SPRING_APPLICATION_NAME:users-api}

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=${SLEUTH_SAMPLER_PROBABILITY:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}

# Without this, http.server.requests is a Micrometer Summary (count+sum+max
# only); the golden-signal latency dashboard needs real histogram buckets
# to compute a distribution, not just an average.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
