jwt.secret=${JWT_SECRET:myfancysecret}
server.port=${SERVER_PORT:8083}
spring.application.name=${SPRING_APPLICATION_NAME:users-api}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=always

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.startup.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:${SLEUTH_SAMPLER_PROBABILITY:1.0}}
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}

server.shutdown=graceful
users.operational.features.verbose-security-errors=${USERS_API_FEATURE_VERBOSE_SECURITY_ERRORS:false}

# Without this, http.server.requests is a Micrometer Summary (count+sum+max
# only); the golden-signal latency dashboard needs real histogram buckets
# to compute a distribution, not just an average.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
