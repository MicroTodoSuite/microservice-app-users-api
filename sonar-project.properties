# SonarQube project config (spec 006 / T001). Coverage from JaCoCo; the quality
# gate stays visibly skipped until the self-hosted server exists.
sonar.projectKey=MicroTodoSuite_users-api
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# Bootstrap/config/model/plumbing excluded from the coverage denominator (D2);
# the tested business logic is UsersController + JwtAuthenticationFilter.
sonar.coverage.exclusions=**/UsersApiApplication.java,**/configuration/**,**/models/**,**/repository/**,**/api/CounterController.java,**/security/AccessUserFilter.java
