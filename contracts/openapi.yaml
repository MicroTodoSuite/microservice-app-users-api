openapi: 3.1.0
info:
  title: Users API
  version: 1.0.0
  description: >
    JWT-protected user directory backed by an in-process datastore. A caller may
    read only the user named in its own token. Requests accept and responses
    return X-Request-Id for correlation. Contract-first source of truth (spec
    007 / T009 and spec 009 / T081).
  contact:
    name: MicroTodoSuite
    url: https://github.com/MicroTodoSuite
  license:
    name: MIT
servers:
  - url: /
    description: Environment-neutral; actuator base-path is '/'.
tags:
  - name: users
  - name: observability
paths:
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all seeded users.
      description: Returns every user in the directory.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/{username}:
    get:
      operationId: getUser
      tags: [users]
      summary: Read a single user.
      description: Returns the user; the username MUST match the caller's token claim.
      security:
        - bearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The token does not own the requested user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /health/startup:
    get:
      operationId: getStartupHealth
      tags: [observability]
      summary: Actuator startup health group (public).
      description: Reports whether the application context has completed startup.
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /health/readiness:
    get:
      operationId: getReadinessHealth
      tags: [observability]
      summary: Actuator readiness health group (public).
      description: Reports whether the API and its database dependency can serve traffic.
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
  /health/liveness:
    get:
      operationId: getLivenessHealth
      tags: [observability]
      summary: Actuator liveness health group (public).
      description: Reports whether the running process is alive.
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /health:
    get:
      operationId: getAggregateHealth
      tags: [observability]
      summary: Aggregate Actuator health (public).
      description: Returns the aggregate status without exposing component details.
      responses:
        '200':
          $ref: '#/components/responses/Health'
  /prometheus:
    get:
      operationId: getPrometheus
      tags: [observability]
      summary: Prometheus metrics exposition (public).
      description: Micrometer Prometheus registry exposition.
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
components:
  headers:
    CorrelationId:
      description: Correlation identifier adopted or generated for this request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Health:
      description: Actuator health status.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    User:
      type: object
      required: [username]
      properties:
        username:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
        status:
          type: integer
